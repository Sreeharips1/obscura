# Local run:  docker compose up --build
# Then open:  http://localhost:8080
services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      OBSCURA_CORS_ORIGINS: http://localhost:8080
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
